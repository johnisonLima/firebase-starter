<h2>Firestore Playground</h2>

<hr>

<h3>Create</h3>

<app-input
    label="Email"
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
/>

<app-button (click)="create()">
    Create
</app-button>

<hr>

<h3>Document</h3>

<app-input
    label="Document Id"
    type="text"
    placeholder="Document Id"
    [(ngModel)]="id"
/>

<app-button (click)="findById()">
    Find By Id
</app-button>

<app-button (click)="findAll()">
    Find All
</app-button>

<hr>

<h3>Update</h3>

<app-input
    label="New Email"
    type="email"
    placeholder="New Email"
    [(ngModel)]="updatedEmail"
/>

<app-button (click)="update()">
    Update
</app-button>

<hr>

<h3>Delete</h3>

<app-button
    variant="destructive"
    (click)="delete()"
>
    Delete
</app-button>

<hr>

<app-button
    variant="outline"
    (click)="onClear()"
>
    Clear
</app-button>

<hr>

<h3>Result</h3>

<pre>{{ result | json }}</pre>
