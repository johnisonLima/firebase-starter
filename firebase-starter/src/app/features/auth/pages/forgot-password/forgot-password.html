<main class="flex min-h-screen items-center justify-center p-6">

  <div class="flex w-full max-w-md flex-col gap-8">

    <app-logo />

    <hlm-card>
        <hlm-card-header>
            <h1 hlmCardTitle>
                Recuperar senha
            </h1>
            <p hlmCardDescription>
                Informe seu e-mail para receber as instruções de redefinição de senha.
            </p>
        </hlm-card-header>

        <div hlmCardContent>
            <form class="flex flex-col gap-6"
                [formGroup]="form" (ngSubmit)="resetPassword()">

                <div hlmFormField>

                    <app-input 
                        hlmInput
                        id="email"
                        label="E-mail" 
                        type="email" 
                        autocomplete="email" 
                        placeholder="voce@email.com" 
                        appAutofocus
                        formControlName="email"
                    >
                        <svg lucideMail icon-start></svg>
                    </app-input>

                    <app-form-error [control]="emailControl" label="E-mail" />
                </div>

                @if (error(); as message) {
                    <p class="text-sm text-destructive">
                    {{ message }}
                    </p>
                }

                @if (success()) {
                    <p class="text-sm text-green-600">
                    Se existir uma conta com este e-mail, enviaremos as instruções para redefinição de senha.
                    </p>
                }

                <app-button
                    type="submit"
                    width="full"
                    [disabled]="!canSubmit()"
                    [loading]="loading()"
                >
                    Entrar
                </app-button>

            </form>

        </div>

        <hlm-card-footer>
            <div class="flex w-full justify-center">

                <a routerLink="/login" class="text-sm text-primary hover:underline">
                    Voltar para o Login
                </a>
            </div>
        </hlm-card-footer>
    </hlm-card>
  </div>
</main>
