<main class="flex min-h-screen items-center justify-center p-6">

  <div class="flex w-full max-w-md flex-col gap-8">

    <app-logo />

    <hlm-card>
        <hlm-card-header>
            <h1 hlmCardTitle>
                Criar conta
            </h1>
            <p hlmCardDescription>
                Preencha os dados abaixo para criar sua conta. 
            </p>
        </hlm-card-header>

        <div hlmCardContent>
            <form class="flex flex-col gap-6"
                [formGroup]="form" (ngSubmit)="register()">

                <div hlmFormField>

                    <app-input 
                        label="E-mail" 
                        type="email" 
                        appAutofocus
                        formControlName="email"
                    >
                        <svg lucideMail icon-start></svg>
                    </app-input>

                    <app-form-error [control]="emailControl" label="E-mail" />
                </div>

                <div hlmFormField>
                    <app-input 
                        label="Senha" 
                        id="password"
                        autocomplete="current-password"
                        type="password" 
                        formControlName="password"
                    >
                        <svg lucideLock icon-start></svg>
                        <svg lucideEye icon-show-password></svg>
                        <svg lucideEyeOff icon-hide-password></svg> 
                    </app-input>

                    <app-form-error [control]="passwordControl" label="Senha" />
                </div>

                <div hlmFormField>

                    <app-input 
                        label="Confirmar senha" 
                        id="confirmPassword"
                        autocomplete="current-password"
                        type="password" 
                        formControlName="confirmPassword"
                    >
                        <svg lucideLock icon-start></svg>
                        <svg lucideEye icon-show-password></svg>
                        <svg lucideEyeOff icon-hide-password></svg> 
                    </app-input>

                    <app-form-error [control]="confirmPasswordControl" label="Confirmação de senha" />
                </div>

                @if (error(); as message) {
                    <p class="text-sm text-destructive">
                    {{ message }}
                    </p>
                }

                <app-button
                    type="submit"
                    width="full"
                    [disabled]="!canSubmit()"
                    [loading]="loading()"
                >
                    Criar conta
                </app-button>

            </form>

        </div>

        <hlm-card-footer>
            <div class="flex w-full justify-center">

                <a routerLink="/login" class="text-sm text-primary hover:underline">
                    Já possui uma conta? Entrar
                </a>
            </div>
        </hlm-card-footer>
    </hlm-card>
  </div>
</main>
