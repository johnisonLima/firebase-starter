<main class="flex min-h-screen items-center justify-center p-6">

  <div class="flex w-full max-w-md flex-col gap-8">

    <app-logo />

    <hlm-card>
        <hlm-card-header>
            <h1 hlmCardTitle>
                Entrar
            </h1>
            <p hlmCardDescription>
                Informe suas credenciais para acessar sua conta.
            </p>
        </hlm-card-header>

        <div hlmCardContent>
            <form class="flex flex-col gap-6"
                [formGroup]="form" (ngSubmit)="login()">
                <div hlmFormField>

                    <app-input 
                        hlmInput
                        id="email"
                        label="E-mail" 
                        type="email" 
                        autofocus
                        autocomplete="email" 
                        placeholder="voce@email.com" 
                        appAutofocus
                        formControlName="email"
                        [ariaDescribedBy]="emailError.errorId"
                    >
                        <svg lucideMail icon-start></svg>
                    </app-input>
                   
                    <app-form-error
                        #emailError
                        [control]="emailControl" 
                        label="E-mail" 
                    /> 
                </div>

                <div hlmFormField >
                    <app-input 
                        hlmInput
                        id="password"
                        label="Senha" 
                        type="password" 
                        autocomplete="current-password"
                        formControlName="password"
                        [ariaDescribedBy]="passwordError.errorId"
                    >
                        <svg lucideLock icon-start></svg>
                        <svg lucideEye icon-show-password></svg>
                        <svg lucideEyeOff icon-hide-password></svg> 
                    </app-input>                   

                    <app-form-error 
                        #passwordError
                        [control]="passwordControl" 
                        label="Senha" 
                    />
                </div>

                <app-button
                    type="submit"
                    width="full"
                    size="lg"
                    [disabled]="!canSubmit()"
                    [loading]="loading()"
                >
                    Entrar
                </app-button>

            </form>

        </div>

        <hlm-card-footer>
            <div class="flex w-full flex-col items-center gap-2">

                <a routerLink="/forgot-password" class="text-sm text-primary hover:underline cursor-pointer">
                Esqueci minha senha
                </a>

                <a routerLink="/register" class="text-sm text-primary hover:underline cursor-pointer">
                Criar conta
                </a>
            </div>
        </hlm-card-footer>
    </hlm-card>
  </div>
</main>
