<main class="flex min-h-screen items-center justify-center p-6">

  <div class="flex w-full max-w-md flex-col gap-8">

    <app-logo />

    <hlm-card>
        <hlm-card-header>
            <h1 hlmCardTitle>
                Entrar
            </h1>
            <p hlmCardDescription>
                Informe suas credenciais para acessar sua conta.
            </p>
        </hlm-card-header>

        <div hlmCardContent>
            <form class="flex flex-col gap-6"
                [formGroup]="form" (ngSubmit)="login()">
                <div hlmFormField>
                    <label hlmLabel for="email">
                        E-mail
                    </label>

                    <input hlmInput 
                        id="email" type="email" autofocus autocomplete="email" placeholder="voce@email.com" 
                        appAutofocus
                        formControlName="email"/>
                   
                    <app-form-error [control]="emailControl" label="E-mail" /> 
                </div>

                <div hlmFormField >
                    <label hlmLabel for="password">
                        Senha
                    </label>

                    <div class="flex items-center rounded-md border border-input focus-within:ring-2 focus-within:ring-ring">
                        <input
                            hlmInput
                            id="password"
                            type="password"
                            autocomplete="current-password"
                            appPasswordVisibility
                            #passwordVisibility="passwordVisibility"
                            formControlName="password"
                            class="border-0 focus:ring-0" />

                        <button
                            type="button"
                            class="shrink-0 px-2 text-xs text-muted-foreground cursor-pointer"
                            (click)="passwordVisibility.toggle()"
                            aria-label="{{  passwordVisibility.visible()
                                    ? 'Ocultar senha'
                                    : 'Mostrar senha'
                            }}">
                            {{ passwordVisibility.visible() ? 'Ocultar' : 'Mostrar' }}
                        </button>
                    </div>
                   

                    <app-form-error [control]="passwordControl" label="Senha" />
                </div>

                <button hlmBtn 
                    type="submit" class="w-full cursor-pointer"
                    [disabled]="!canSubmit()">
                    {{ loading() ? 'Entrando...' : 'Entrar' }}
                </button>

            </form>

        </div>

        <hlm-card-footer>
            <div class="flex w-full flex-col items-center gap-2">

                <a routerLink="/forgot-password" class="text-sm text-primary hover:underline cursor-pointer">
                Esqueci minha senha
                </a>

                <a routerLink="/register" class="text-sm text-primary hover:underline cursor-pointer">
                Criar conta
                </a>
            </div>
        </hlm-card-footer>
    </hlm-card>
  </div>
</main>
