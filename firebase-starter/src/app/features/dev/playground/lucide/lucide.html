<div class="container-test">
  
  <div class="icon-test">
    <h1>Lucide Playground</h1>
    <div class="icons">
      <svg lucideHouse></svg>
      <svg
        lucideUser
        width="32"
        height="32"
      ></svg>
      <svg
        lucideSettings
        width="40"
        height="40"
      ></svg>
    </div>
  </div>
  
  <div class="toast-test">
    <h1>Toast Playground</h1>
    <div class="btns">
      <button
        type="button"
        class="btn"
        (click)="testToast()"
      >
        Testar Toast
      </button>
      
      <button
      class="btn"
        type="button"
        (click)="testMultipleToasts()"
      >
        Testar Múltiplos Toasts
      </button>
    </div>
  </div>

  <div class="dialog-test">
    <h1>Dialog Playground</h1>

    <button class="btn" type="button" (click)="openDialog()">
      Abrir Dialog
    </button>

    <app-dialog
      [open]="showDialog()"
      title="Novo projeto"
      description="Preencha os dados básicos — você pode editar tudo depois."
      (closed)="closeDialog()"
    >
      <div dialog-icon>
        <svg lucideTrash2></svg>
      </div>

      <div dialog-content>
          <h3 class="dialog__panel-title">Preferências gerais</h3>

          <div class="setting-row">
            <div>
              <p class="setting-row__title">Modo escuro por padrão</p>
              <p class="setting-row__desc">Aplica-se a todos os membros novos</p>
            </div>
            <input type="checkbox" class="toggle" checked>
          </div>
          <div class="setting-row">
            <div>
              <p class="setting-row__title">Permitir convites externos</p>
              <p class="setting-row__desc">Qualquer membro pode convidar pessoas de fora</p>
            </div>
            <input type="checkbox" class="toggle">
          </div>
          <div class="setting-row">
            <div>
              <p class="setting-row__title">Backup automático diário</p>
              <p class="setting-row__desc">Executa às 03:00, horário do workspace</p>
            </div>
            <input type="checkbox" class="toggle" checked>
          </div>

          <div class="setting-group">
            <h3 class="dialog__panel-title">Idioma e região</h3>
            <div class="field__row">
              <div class="field">
                <label class="field__label">Idioma</label>
                <select class="select">
                  <option>Português (Brasil)</option>
                  <option>English</option>
                </select>
              </div>
              <div class="field">
                <label class="field__label">Fuso horário</label>
                <select class="select">
                  <option>America/Bahia (GMT-3)</option>
                </select>
              </div>
            </div>
          </div>      
      </div>

      <div class="wrap-btns" dialog-footer>
        <button class="btn btn--block" type="button" (click)="closeDialog()">
          Cancelar
        </button>

        <button class="btn btn--block" type="button">
          Criar projeto
        </button>
      </div>
    </app-dialog>
  </div>
</div>
