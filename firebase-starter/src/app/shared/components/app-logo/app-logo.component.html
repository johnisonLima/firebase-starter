<div
  class="
    flex
    flex-col
    items-center
    gap-4
    text-center
  "
>

  @if (brand.logo) {

    <img
      [src]="brand.logo"
      [alt]="brand.name"
      [width]="size()"
      [height]="size()"
      class="object-contain"
    />

  }

  @if (showName()) {

    <h1 class="text-2xl font-bold">

      {{ brand.name }}

    </h1>

  }

  @if (showDescription()) {

    <p class="text-muted-foreground">

      {{ brand.description }}

    </p>

  }

</div>
